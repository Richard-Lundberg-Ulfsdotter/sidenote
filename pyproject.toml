[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sidenote"
version = "0.1.0"
description = "Keyboard-driven terminal reviewer for ODT and docx documents with character-level comments"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Richard Lundberg-Ulfsdotter" }]
requires-python = ">=3.10"
keywords = ["odt", "docx", "annotations", "comments", "tui", "review", "manuscript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
dependencies = [
    "odfpy>=1.4",
    "textual>=0.80",
]

[project.urls]
Repository = "https://github.com/Richard-Lundberg-Ulfsdotter/sidenote"
Issues = "https://github.com/Richard-Lundberg-Ulfsdotter/sidenote/issues"

[project.scripts]
sidenote = "sidenote.cli:main"

[tool.setuptools.packages.find]
include = ["sidenote*"]
